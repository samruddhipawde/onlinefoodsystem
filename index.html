<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Food Ordering System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
<div class="container">
<a class="navbar-brand" href="#">FoodExpress</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navMenu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
<li class="nav-item"><a class="nav-link" href="#menu">Order Foods</a></li>
<li class="nav-item"><a class="nav-link" href="#special">Special Menu</a></li>
<li class="nav-item">
<a class="nav-link" href="#cart">
Cart (<span id="cartCount">0</span>)
</a>
</li>
</ul>
</div>
</div>
</nav>

<!-- Home -->
<section id="home" class="hero">
<div class="container text-center">
<h1>Welcome to FoodExpress</h1>
<p>Delicious Food Delivered Fast</p>
</div>
</section>

<!-- Menu -->
<section id="menu" class="container my-5">
<h2 class="text-center mb-4">Food Menu</h2>
<div class="row" id="foodContainer"></div>
</section>

<!-- Special Menu -->
<section id="special" class="container my-5">
<h2 class="text-center mb-4">Special Menu</h2>

<div class="card special-card p-4">
<h4>Weekend Combo Offer</h4>
<p>Burger + Fries + Coke = ₹299</p>
</div>
</section>

<!-- Cart -->
<section id="cart" class="container my-5">
<h2 class="text-center mb-4">Cart</h2>

<div id="cartItems"></div>

<h4 class="mt-3">
Total Amount: ₹<span id="totalAmount">0</span>
</h4>

<button class="btn btn-success mt-3" onclick="showSummary()">
Proceed to Checkout
</button>
</section>

<!-- Order Summary -->
<section class="container my-5" id="summarySection" style="display:none;">
<h2>Order Summary</h2>

<div id="summaryItems"></div>

<h4 class="mt-3">
Total: ₹<span id="summaryTotal"></span>
</h4>

<button class="btn btn-primary mt-3" onclick="paymentPage()">
Proceed to Payment
</button>
</section>

<!-- Payment -->
<section class="container my-5" id="paymentSection" style="display:none;">
<h2>Payment Gateway</h2>

<select class="form-select w-50">
<option>UPI</option>
<option>Credit Card</option>
<option>Debit Card</option>
<option>Cash On Delivery</option>
</select>

<button class="btn btn-danger mt-3" onclick="placeOrder()">
Place Order
</button>

<div id="orderStatus" class="mt-3"></div>
</section>

<!-- Modal -->
<div class="modal fade" id="foodModal">
<div class="modal-dialog">
<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title">Food Details</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body" id="modalBody"></div>

</div>
</div>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
